# TaskFlow backend - production stack.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Services
#   db         PostgreSQL 17, data in the "pgdata" volume, never published
#   migrate    one-off release step: check --deploy, migrate, collectstatic
#   web        gunicorn + Django (starts only after migrate succeeds)
#   scheduler  supercronic: daily deadline reminders, nightly progress fix
#   nginx      serves /static and /media, proxies the API; bound to
#              127.0.0.1 so only the host's TLS proxy (Plesk) can reach it
#   db-backup  nightly pg_dump into ./backups with retention
#
# Values come from .env in this directory (see .env.production.example).

name: taskflow

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  image: ${IMAGE:-ghcr.io/kot-enterprises/taskflow-backend}:${IMAGE_TAG:-latest}
  env_file: .env
  environment:
    DB_HOST: db
    DB_PORT: "5432"
  secrets:
    - source: firebase_admin
      target: firebase-admin.json
  networks: [data, edge]
  security_opt: ["no-new-privileges:true"]
  logging: *logging

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  migrate:
    <<: *app
    command: ["/app/deploy/scripts/release.sh"]
    restart: "no"
    volumes:
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true

  web:
    <<: *app
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - static:/app/staticfiles:ro
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose: ["8000"]
    mem_limit: 1g
    cpus: 1.5

  scheduler:
    <<: *app
    command: ["supercronic", "-passthrough-logs", "/app/deploy/scripts/crontab"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    mem_limit: 512m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [edge]
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  db-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-1}
    volumes:
      - ./deploy/scripts/db-backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [data]
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    logging: *logging

networks:
  # The database network has no route out; only containers on it can
  # reach Postgres.
  data:
    internal: true
  # Outbound (Gemini, Firebase, SMTP) and nginx -> web.
  edge: {}

volumes:
  pgdata:
  static:
  media:

secrets:
  firebase_admin:
    file: ./secrets/firebase-admin.json
