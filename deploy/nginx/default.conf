# nginx inside the stack. TLS ends at the host's proxy (Plesk), which
# forwards plain HTTP to 127.0.0.1:${HTTP_PORT} with X-Forwarded-Proto set.

upstream django {
    server web:8000;
    keepalive 16;
}

# Pass the original scheme through; fall back to this hop's scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Attachments and discussion files.
    client_max_body_size 25m;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        # Above the assistant's 45 s model budget.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
