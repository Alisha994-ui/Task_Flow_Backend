# TaskFlow backend: test -> build image -> deploy to the VPS.
#
# Repository secrets (Settings > Secrets and variables > Actions), kept in
# a "production" environment so deploys can require approval:
#   DEPLOY_HOST          server hostname or IP
#   DEPLOY_USER          SSH user that can run docker (e.g. "deploy")
#   DEPLOY_SSH_KEY       private key for that user (ed25519)
#   DEPLOY_KNOWN_HOSTS   output of: ssh-keyscan -t ed25519 <host>
#   GHCR_READ_TOKEN      PAT with read:packages (only if the image is private)
# Optional variables: DEPLOY_PORT (default 22), DEPLOY_PATH (default /opt/taskflow)

name: Backend CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Check and test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskflow_ci
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-key-not-used-anywhere-else-0123456789abcdefghijklmnop
      DEBUG: "False"
      ALLOWED_HOSTS: localhost
      SECURE_HSTS_SECONDS: "31536000"
      DB_NAME: taskflow_ci
      DB_USER: taskflow
      DB_PASSWORD: taskflow
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Django deploy checks
        run: python manage.py check --deploy --fail-level WARNING

      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test --noinput --verbosity 2

  build:
    name: Build and push image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name and tag
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/taskflow-backend" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  deploy:
    name: Deploy to production
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      USER: ${{ secrets.DEPLOY_USER }}
      PORT: ${{ vars.DEPLOY_PORT || '22' }}
      APP_DIR: ${{ vars.DEPLOY_PATH || '/opt/taskflow' }}
      IMAGE: ${{ needs.build.outputs.image }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Ship compose and config
        run: |
          tar czf - docker-compose.prod.yml deploy \
            | ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" "mkdir -p '$APP_DIR' && tar xzf - -C '$APP_DIR'"

      - name: Pull, release, start
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" \
            APP_DIR="$APP_DIR" IMAGE="$IMAGE" TAG="$TAG" GHCR_READ_TOKEN="$GHCR_READ_TOKEN" GH_ACTOR="${{ github.actor }}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          if [ -n "${GHCR_READ_TOKEN:-}" ]; then
            echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          fi
          # Record what is running, so a restart or rollback uses the same tag.
          cp .env ".env.bak.$(date -u +%Y%m%d%H%M%S)"
          sed -i "s#^IMAGE=.*#IMAGE=${IMAGE}#; s#^IMAGE_TAG=.*#IMAGE_TAG=${TAG}#" .env
          docker compose -f docker-compose.prod.yml pull web
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          port="$(grep -E '^HTTP_PORT=' .env | cut -d= -f2)"; port="${port:-8080}"
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/healthz/" >/dev/null; then
              echo "Healthy: ${IMAGE}:${TAG}"
              docker image prune -f >/dev/null
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after 150 s" >&2
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs --tail=100 migrate web
          exit 1
          REMOTE
